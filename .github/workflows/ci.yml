name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  sim-tests:
    name: Simulation tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj

      - name: Build
        run: dotnet build Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj --no-restore -c Release

      - name: Check generated data is current
        run: dotnet run --project tools/DataGen -- -check

      - name: Test
        run: dotnet test Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj --no-build -c Release --filter "TestCategory!=Benchmark" --logger "trx;LogFileName=sim-tests.trx"

      - name: Benchmark (report only)
        run: dotnet test Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj --no-build -c Release --filter "TestCategory=Benchmark" --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-test-results
          path: Oduncu.Sim.Tests/TestResults/*.trx

  game-compile:
    name: Game scripts compile (reference assemblies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile Assets/Game against Unity reference assemblies
        run: tools/GameCompileCheck/check.sh

  android-build:
    name: Android build (Unity)
    runs-on: ubuntu-latest
    needs: [sim-tests, game-compile]
    # Builds the game on every push to main, on pull requests into main, and on demand from the
    # Actions tab. Other branch pushes skip it: a Unity build takes far longer than the other jobs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Unity needs a licence (https://game.ci/docs/github/activation). Repository secrets:
    #   Personal licence:     UNITY_LICENSE (contents of the .ulf file), UNITY_EMAIL, UNITY_PASSWORD
    #   Pro/Plus licence:     UNITY_SERIAL, UNITY_EMAIL, UNITY_PASSWORD
    # Without them the job warns and skips instead of failing.
    env:
      HAS_UNITY_LICENSE: ${{ (secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '') && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: Skip without a Unity licence
        if: env.HAS_UNITY_LICENSE != 'true'
        run: |
          msg="Unity licence secrets are not set, so the Android build was skipped. Add UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL and UNITY_PASSWORD in the repository's Actions secrets."
          echo "::warning title=Android build skipped::$msg"
          echo "### Android build skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # The Unity Android editor image is ~15 GB; the stock runner does not have room for it
      # plus the Library and the IL2CPP build.
      - name: Free disk space
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          large-packages: false

      - uses: actions/checkout@v4
        if: env.HAS_UNITY_LICENSE == 'true'
        with:
          lfs: true

      - name: Cache Library
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/cache@v4
        with:
          path: Oduncu.Unity/Library
          key: Library-Android-${{ hashFiles('Oduncu.Unity/Assets/**', 'Oduncu.Unity/Packages/**', 'Oduncu.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Oduncu.Unity
          targetPlatform: Android
          buildMethod: Oduncu.Game.Editor.BuildScript.BuildAndroid
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload APK
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oduncu-android-dev-${{ github.sha }}
          path: Oduncu.Unity/Build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
