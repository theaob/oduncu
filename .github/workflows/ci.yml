name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sim-tests:
    name: Simulation tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj

      - name: Build
        run: dotnet build Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test Oduncu.Sim.Tests/Oduncu.Sim.Tests.csproj --no-build -c Release --logger "trx;LogFileName=sim-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-test-results
          path: Oduncu.Sim.Tests/TestResults/*.trx

  android-build:
    name: Android build (Unity)
    runs-on: ubuntu-latest
    needs: sim-tests
    # Unity needs a licence. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository
    # secrets (see https://game.ci/docs/github/activation) and this job starts running.
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Skip without a Unity licence
        if: env.HAS_UNITY_LICENSE != 'true'
        run: echo "UNITY_LICENSE secret not set; skipping Android build."

      - name: Cache Library
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/cache@v4
        with:
          path: Oduncu.Unity/Library
          key: Library-Android-${{ hashFiles('Oduncu.Unity/Assets/**', 'Oduncu.Unity/Packages/**', 'Oduncu.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Oduncu.Unity
          targetPlatform: Android
          buildMethod: Oduncu.Game.Editor.BuildScript.BuildAndroid
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload APK
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oduncu-android-dev
          path: Oduncu.Unity/Build/Android/*.apk
